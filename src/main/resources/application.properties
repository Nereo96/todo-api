spring.application.name=todo-api

# H2 in memoria: nessuna installazione, i dati si perdono al riavvio
# TODO: profilo PostgreSQL (docker-compose) per un ambiente reale
spring.datasource.url=jdbc:h2:mem:todo;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# lo schema lo crea Flyway, Hibernate si limita a validarlo
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# job di pulizia: ogni 15 minuti
todo.cleanup.cron=0 */15 * * * *
